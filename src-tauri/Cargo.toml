[package]
name = "invoice-ocr-app"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "invoice_ocr_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.22"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
dirs = "5"
rfd = "0.15"
rust_xlsxwriter = "0.83"
# 注意：不要启用 core_graphics / libc++ / libstdc++ 等隐含 "static" 的 feature，
# 否则 pdfium-render 0.9.x 会编译为静态链接模式，bind_to_system_library / bind_to_library 将不可用。
pdfium-render = { version = "0.9.3", features = ["image_025"] }
pdfium-auto = "0.3.1"
image = "0.25"
dotenvy = "0.15"

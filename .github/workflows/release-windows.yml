name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # pdfium 动态库已提交在 src-tauri/resources/pdfium.dll（与 pdfium-auto 版本 chromium/7961 一致），
      # 打包时通过 tauri.windows.conf.json 的 bundle.resources 打进安装包，运行时不联网下载。
      # 如需更新版本：运行 scripts/download-pdfium.ps1 后提交。

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ========== 升级到 tauri-action@v1 ==========
      - name: Build & create release
        uses: tauri-apps/tauri-action@v1          # 重要：从 v0 升级到 v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "发票 OCR 识别 v__VERSION__"
          releaseBody: |
            发票 OCR 识别 Windows 安装包。

            - `invoice-ocr-app_<version>_x64-setup.exe`：NSIS 安装包（推荐）
            - `invoice-ocr-app_<version>_x64_en-US.msi`：MSI 安装包
          releaseDraft: true
          prerelease: false